var DAYS=D.days, S=D.stores, TG=D.tgt, AC=D.act, LY=D.ly;
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- helpers ---------- */
function utc(s){var p=s.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function dlabel(s){var p=s.split("-");return (+p[2])+" "+MON[+p[1]-1];}
function dlong(s){var p=s.split("-");return (+p[2])+" "+MON[+p[1]-1]+" "+p[0];}
/* Indian money shorthand - a review reads "1.21 Cr" far faster than 12,085,250 */
function money(v){
  if(v===null||v===undefined||!isFinite(v)) return "–";
  var a=Math.abs(v), s=v<0?"-":"";
  if(a>=1e7) return s+"₹"+(a/1e7).toFixed(2)+" Cr";
  if(a>=1e5) return s+"₹"+(a/1e5).toFixed(1)+" L";
  return s+"₹"+Math.round(a).toLocaleString("en-IN");
}
function rupee(v){ if(v===null||v===undefined||!isFinite(v)) return "–";
  /* the sign belongs before the symbol: -₹1,234, never ₹-1,234 */
  return (v<0?"-":"")+"₹"+Math.round(Math.abs(v)).toLocaleString("en-IN"); }
function pct(v){ return (v===null||!isFinite(v))?"–":(v*100).toFixed(1)+"%"; }
function spct(v){ return (v===null||!isFinite(v))?"–":(v>=0?"+":"")+(v*100).toFixed(1)+"%"; }
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}

/* ---------- season geometry ---------- */
var LASTI=(function(){ var i=DAYS.indexOf(D.last); if(i>=0) return i;
  for(var j=DAYS.length-1;j>=0;j--) if(DAYS[j]<=D.last) return j; return -1; })();
var ELAPSED=LASTI+1, REMAIN=DAYS.length-ELAPSED;

var state={cl:"",st:"",tab:"summary",sort:{}};
function active(){
  var out=[];
  for(var i=0;i<S.length;i++){
    if(state.cl && S[i].cluster!==state.cl) continue;
    if(state.st && S[i].code!==state.st) continue;
    out.push(i);
  }
  return out;
}
/* Sum a matrix over the selected stores, between two day indices inclusive. */
function sum(M,idx,a,b){
  var t=0;
  for(var i=0;i<idx.length;i++){ var row=M[idx[i]];
    for(var d=a;d<=b;d++) t+=row[d]||0; }
  return t;
}
function storeSum(M,s,a,b){ var t=0,row=M[s]; for(var d=a;d<=b;d++) t+=row[d]||0; return t; }

/* ---- like-to-like, matching the main dashboard ---------------------------
   Each current-season day is paired with its counterpart D.lyShift days back,
   and a pair is kept only if the store was already trading on the last-year
   side. A store that opened part-way through the prior window is not dropped -
   its window is clipped to the days both years share.

   Totals use that same basket on both sides of the division. Summing every
   store's sales against whatever last year happened to hold would measure 36
   stores against a base that did not contain most of them, which is how a
   festival season invents a +485% that means nothing. */
function shiftDays(dstr,n){
  var p=dstr.split("-");
  var t=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])+n*86400000);
  return t.getUTCFullYear()+"-"+String(t.getUTCMonth()+1).padStart(2,"0")
        +"-"+String(t.getUTCDate()).padStart(2,"0");
}
function lyDate(dstr){ return shiftDays(dstr,-D.lyShift); }

function ltlPair(s,a,b){
  var st=S[s];
  if(!st.opened||a>b) return null;
  var cur=0, ly=0, n=0;
  for(var d=a;d<=b;d++){
    if(lyDate(DAYS[d]) < st.opened) continue;   // not trading then - drop the pair
    cur+=AC[s][d]||0; ly+=LY[s][d]||0; n++;
  }
  if(!n||!ly) return null;
  return [cur,ly,n];
}
/* The basket: only the stores that have a comparable prior period, both sides. */
function ltlBasket(idx,a,b){
  var cur=0, ly=0, n=0, clipped=0, span=b-a+1;
  for(var i=0;i<idx.length;i++){
    var pr=ltlPair(idx[i],a,b);
    if(!pr) continue;
    cur+=pr[0]; ly+=pr[1]; n++;
    if(pr[2]<span) clipped++;
  }
  return n ? {cur:cur,ly:ly,n:n,clipped:clipped,growth:ly?cur/ly-1:null} : null;
}

function headline(){
  var idx=active(), n=DAYS.length-1;
  var seasonT = sum(TG,idx,0,n);
  var tToDate = ELAPSED>0 ? sum(TG,idx,0,LASTI) : 0;
  var aToDate = ELAPSED>0 ? sum(AC,idx,0,LASTI) : 0;
  var ltl = ELAPSED>0 ? ltlBasket(idx,0,LASTI) : null;
  return {
    seasonT:seasonT, tToDate:tToDate, aToDate:aToDate,
    ach: tToDate? aToDate/tToDate : null,
    gap: aToDate - tToDate,
    banked: seasonT? aToDate/seasonT : null,
    rate: ELAPSED? aToDate/ELAPSED : null,
    need: REMAIN>0 ? Math.max(seasonT-aToDate,0)/REMAIN : null,
    ltl: ltl, nStores: idx.length,
    growth: ltl ? ltl.growth : null
  };
}

function renderTiles(){
  var h=headline(), host=document.getElementById("tiles");
  host.innerHTML="";
  function tile(k,v,n,cls,hero){
    var t=el("div","tile"+(hero?" hero":""));
    t.appendChild(el("div","k",k));
    t.appendChild(el("div","v"+(cls?" "+cls:""),v));
    if(n) t.appendChild(el("div","n",n));
    host.appendChild(t);
  }
  var achCls = h.ach===null ? "" : (h.ach>=1?"pos":(h.ach>=0.9?"":"neg"));
  tile("Achievement to date", pct(h.ach), "day "+ELAPSED+" of "+DAYS.length+" · "+REMAIN+" left", achCls, true);
  tile("Actual to date", money(h.aToDate), "against "+money(h.tToDate)+" target");
  tile("Gap to date", money(h.gap), h.gap>=0?"ahead of plan":"behind plan", h.gap>=0?"pos":"neg");
  var sp=sspdOf(active()), cv=convOf(active());
  tile("SSPD "+mtdLabel(), sp===null?"–":rupee(sp)+"/sq ft/day", "month to date");
  tile("Conversion "+mtdLabel(), cv===null?"–":pct(cv),
       cv===null?"no walk-in readings":"bills \u00f7 net walk-ins");
  tile("Season target", money(h.seasonT), pct(h.banked)+" banked so far");
  tile("Run-rate so far", money(h.rate)+"/d", "over "+ELAPSED+" day"+(ELAPSED===1?"":"s"));
  tile("Needed for balance", h.need===null?"–":money(h.need)+"/d",
       (h.need&&h.rate)?(h.need/h.rate).toFixed(2)+"× current rate":"",
       (h.need&&h.rate&&h.need/h.rate>1.25)?"neg":"");
  tile("LTL vs last year", spct(h.growth),
       h.ltl ? h.ltl.n+" of "+h.nStores+" stores comparable"
             : "no store has a comparable prior period yet",
       h.growth===null?"":(h.growth>=0?"pos":"neg"));
}

/* ---------- pace chart: where the gap opened, and whether it is closing ---- */
function renderPace(host){
  var idx=active(), W=1000, H=260, L=64, R=16, T=14, B=26;
  var ct=[], ca=[], runT=0, runA=0;
  for(var d=0;d<DAYS.length;d++){
    runT+=sum(TG,idx,d,d); ct.push(runT);
    if(d<=LASTI){ runA+=sum(AC,idx,d,d); ca.push(runA); }
  }
  var max=Math.max(ct[ct.length-1]||1, ca.length?ca[ca.length-1]:0)*1.04;
  function X(i){ return L+(W-L-R)*(DAYS.length<2?0:i/(DAYS.length-1)); }
  function Y(v){ return T+(H-T-B)*(1-(v/max)); }
  function path(arr){ var p=""; for(var i=0;i<arr.length;i++) p+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(arr[i]).toFixed(1); return p; }

  /* width 100% with a fixed height letterboxes the drawing, because the default
   preserveAspectRatio fits the height first. Letting height follow the width
   keeps the chart filling the panel at any screen size. */
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Cumulative target against cumulative actual">';
  for(var g=0;g<=4;g++){
    var v=max*g/4, y=Y(v);
    svg+='<line class="grid" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'
       + '<text class="lbl" x="'+(L-7)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+money(v)+'</text>';
  }
  for(var i=0;i<DAYS.length;i+=7)
    svg+='<text class="lbl" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+dlabel(DAYS[i])+'</text>';
  // Diwali day marker - the whole season points at it
  var di=DAYS.indexOf("2026-11-08");
  if(di>=0) svg+='<line x1="'+X(di).toFixed(1)+'" y1="'+T+'" x2="'+X(di).toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--fest)" stroke-width="1" stroke-dasharray="3 3"/>'
               + '<text class="lbl" x="'+(X(di)-5).toFixed(1)+'" y="'+(T+10)+'" text-anchor="end" fill="var(--fest)">Diwali</text>';
  svg+='<path d="'+path(ct)+'" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5 4"/>';
  if(ca.length) svg+='<path d="'+path(ca)+'" fill="none" stroke="var(--fest)" stroke-width="2.5"/>';
  svg+='</svg>';

  host.insertAdjacentHTML("beforeend",
    '<div class="legend"><span><i style="background:var(--ink-3)"></i>Cumulative target</span>'
   +'<span><i style="background:var(--fest)"></i>Cumulative actual</span></div>'+svg);
}

/* ---------- tables ---------- */
function sortOf(){ return state.sort[state.tab]||{c:null,dir:"desc"}; }
function sortHead(th,c){
  var so=sortOf(); th.className=(th.className?th.className+" ":"")+"sortable";
  if(so.c===c){ th.className+=" sorted"+(so.dir==="desc"?" desc":""); }
  th.addEventListener("click",function(){
    var cur=sortOf();
    state.sort[state.tab]= (cur.c===c) ? {c:c,dir:cur.dir==="desc"?"asc":"desc"} : {c:c,dir:"desc"};
    render();
  });
}
function table(cols, rows, totalRow){
  var wrap=el("div","scroll"), tb=el("table"), th=el("thead"), hr=el("tr");
  cols.forEach(function(c,i){
    var h=el("th",i===0?"stick1":null,c.lab);
    if(i===0) h.style.textAlign="left";
    if(c.key!==undefined) sortHead(h,c.key);
    hr.appendChild(h);
  });
  th.appendChild(hr); tb.appendChild(th);
  var body=el("tbody");
  if(totalRow){
    var tr=el("tr","total");
    cols.forEach(function(c,i){ tr.appendChild(el("td",i===0?"code":(c.cls||"num"), totalRow[i])); });
    body.appendChild(tr);
  }
  var so=sortOf();
  if(so.c!==null){
    var ci=-1; cols.forEach(function(c,i){ if(c.key===so.c) ci=i; });
    if(ci>=0) rows.sort(function(a,b){
      var x=a.sortv[ci], y=b.sortv[ci];
      if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
      if(typeof x==="string") return so.dir==="desc"? y.localeCompare(x) : x.localeCompare(y);
      return so.dir==="desc"? y-x : x-y;
    });
  }
  rows.forEach(function(r){
    var tr=el("tr");
    r.cells.forEach(function(v,i){
      var td=el("td",i===0?"code":(cols[i].cls||"num"));
      if(v && v.html){ td.innerHTML=v.html; } else { td.textContent=v; }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  tb.appendChild(body); wrap.appendChild(tb);
  return wrap;
}

/* ---- MTD operating measures ----------------------------------------------
   SSPD and conversion over the calendar month to date, so a review can see the
   gap and the two numbers that usually explain it side by side.

   Both are ratios, so a total sums the parts and divides once - never an
   average of store percentages. Conversion counts only the days that actually
   carried a walk-in reading; a store with no counter is blank rather than 0%,
   and the latest day is normally still missing its footfall.               */
function mtdLabel(){
  var p=D.mtdFrom.split("-");
  return MON[+p[1]-1]+" MTD";
}
function sspdOf(idx){
  var num=0, den=0;
  for(var i=0;i<idx.length;i++){
    var st=S[idx[i]], m=st.mtd;
    if(!m||!st.sqft||!m[4]) continue;
    num+=m[0]; den+=st.sqft*m[4];
  }
  return den? num/den : null;
}
function convOf(idx){
  var b=0, f=0, any=false;
  for(var i=0;i<idx.length;i++){
    var m=S[idx[i]].mtd;
    if(!m||!m[3]) continue;            // no day carried a footfall reading
    any=true; b+=m[1]; f+=m[2];
  }
  return (any&&f)? b/f : null;
}

function storeRows(idx){
  var n=DAYS.length-1, out=[];
  idx.forEach(function(s){
    var st=S[s];
    var seasonT=storeSum(TG,s,0,n);
    var tTD=ELAPSED>0?storeSum(TG,s,0,LASTI):0;
    var aTD=ELAPSED>0?storeSum(AC,s,0,LASTI):0;
    var sspd=sspdOf([s]), conv=convOf([s]);
    var pr=ELAPSED>0?ltlPair(s,0,LASTI):null;
    var ltl=pr?pr[0]/pr[1]-1:null;
    /* Mark a comparison measured over fewer days than the season has run, so a
       part-window figure is never read as a full one. */
    var clip=(pr&&pr[2]<ELAPSED)
      ? "Measured over "+pr[2]+" of "+ELAPSED+" days, matched to the same dates "
        +D.lyShift+" days earlier, because "+st.code+" opened "+dlong(st.opened)+"."
      : null;
    var ach=tTD?aTD/tTD:null, gap=aTD-tTD;
    var need=REMAIN>0?Math.max(seasonT-aTD,0)/REMAIN:null;
    var notOpen = st.isNew && aTD===0;
    var name = notOpen
      ? {html:'<span>'+st.code+'</span> <span class="pill">opens '+(st.firstTarget?dlabel(st.firstTarget):"?")+'</span>'}
      : st.code;
    out.push({
      cells:[name, st.cluster||"", rupee(seasonT), rupee(tTD), rupee(aTD),
             notOpen?"–":pct(ach), notOpen?"–":rupee(gap),
             need===null?"–":rupee(need),
             sspd===null?"–":rupee(sspd), conv===null?"–":pct(conv),
             (notOpen||ltl===null) ? "–"
               : (clip ? {html:spct(ltl)+'<sup class="clip" title="'+clip+'">*</sup>'} : spct(ltl))],
      sortv:[st.code, st.cluster||"", seasonT, tTD, aTD,
             notOpen?null:ach, notOpen?null:gap, need, sspd, conv, notOpen?null:ltl]
    });
  });
  return out;
}

function viewSummary(host){
  host.appendChild(el("h2",null,"Season pace"));
  host.appendChild(el("p","note",
    "Cumulative target against cumulative actual across the 45 days. The gap between the two lines is "
    +"the shortfall to date; the question in a review is whether it is widening or closing. "
    +"Last year is not drawn here because Diwali moved 19 days, so the calendar lines do not overlay. "
    +"The vs LY column below is like-to-like — same stores, same days, both sides — against "
    +dlong(lyDate(DAYS[0]))+" to "+dlong(lyDate(DAYS[DAYS.length-1]))
    +", the matching run-up to Diwali 2025."));
  renderPace(host);

  host.appendChild(el("h2",null,"By cluster, season to date"));
  var byCl={}, idx=active(), n=DAYS.length-1;
  idx.forEach(function(s){
    var c=S[s].cluster||"(none)";
    var o=byCl[c]||(byCl[c]={t:0,td:0,a:0,stores:0,idx:[]});
    o.t+=storeSum(TG,s,0,n); o.stores++; o.idx.push(s);
    if(ELAPSED>0){ o.td+=storeSum(TG,s,0,LASTI); o.a+=storeSum(AC,s,0,LASTI); }
  });
  var rows=Object.keys(byCl).map(function(c){
    var o=byCl[c], ach=o.td?o.a/o.td:null;
    /* Each cluster gets its own like-to-like basket, so the comparison is
       between the same stores over the same days on both sides. */
    var b=ELAPSED>0?ltlBasket(o.idx,0,LASTI):null;
    var lyCell = b ? (b.n<o.stores
        ? {html:spct(b.growth)+'<sup class="clip" title="Like-to-like across '
            +b.n+' of '+o.stores+' stores - the rest had no trading in the matching '
            +'period last year.">*</sup>'}
        : spct(b.growth)) : "–";
    var sp=sspdOf(o.idx), cv=convOf(o.idx);
    return { cells:[c, o.stores, rupee(o.t), rupee(o.td), rupee(o.a), pct(ach), rupee(o.a-o.td),
                    sp===null?"–":rupee(sp), cv===null?"–":pct(cv), lyCell],
             sortv:[c, o.stores, o.t, o.td, o.a, ach, o.a-o.td, sp, cv, b?b.growth:null] };
  });
  var tot=rows.reduce(function(p,r){return [p[0]+r.sortv[1],p[1]+r.sortv[2],p[2]+r.sortv[3],p[3]+r.sortv[4]];},[0,0,0,0]);
  host.appendChild(table(
    [{lab:"Cluster",key:"c",cls:"name"},{lab:"Stores",key:"n"},{lab:"Season target",key:"t"},
     {lab:"Target to date",key:"td"},{lab:"Actual",key:"a"},{lab:"Ach%",key:"ach"},
     {lab:"Gap",key:"g"},{lab:"SSPD "+mtdLabel(),key:"sspd"},{lab:"Conv% "+mtdLabel(),key:"conv"},
     {lab:"vs LY",key:"ly"}],
    rows,
    ["ALL CLUSTERS", tot[0], rupee(tot[1]), rupee(tot[2]), rupee(tot[3]),
     pct(tot[2]?tot[3]/tot[2]:null), rupee(tot[3]-tot[2]),
     sspdOf(idx)===null?"–":rupee(sspdOf(idx)), convOf(idx)===null?"–":pct(convOf(idx)),
     spct(headline().growth)]));
}

function viewStores(host){
  host.appendChild(el("h2",null,"Store performance, season to date"));
  host.appendChild(el("p","note",
    "Target to date counts only the days that have happened. Needed/day is what the remaining "
    +REMAIN+" day"+(REMAIN===1?"":"s")+" must average for the store to finish on its season number. "
    +"Stores opening later in the season carry a target but no history yet and are marked. "
    +"SSPD and Conv% are the calendar month to date ("+dlong(D.mtdFrom)+" to "+dlong(D.mtdTo)
    +"), not the season - footfall capture only began on 1 Sep, so a season-to-date "
    +"conversion would rest on a handful of readings. Conversion counts only days that "
    +"carried a walk-in reading, and is blank where a store has none. "
    +"vs LY is like-to-like on the same basis as the main dashboard: every day is paired with its "
    +"counterpart "+D.lyShift+" days earlier and a pair counts only where the store was already "
    +"trading then, so a store that opened mid-way through the prior window is compared over the "
    +"days both years share rather than dropped. Those carry a * with the exact span."));
  var idx=active(), h=headline();
  if(!idx.length){ host.appendChild(el("div","empty","No stores match the current filters.")); return; }
  host.appendChild(table(
    [{lab:"Store",key:"code",cls:"code"},{lab:"Cluster",key:"cl",cls:"name"},
     {lab:"Season target",key:"t"},{lab:"Target to date",key:"td"},{lab:"Actual",key:"a"},
     {lab:"Ach%",key:"ach"},{lab:"Gap",key:"g"},{lab:"Needed/day",key:"need"},
     {lab:"SSPD "+mtdLabel(),key:"sspd"},{lab:"Conv% "+mtdLabel(),key:"conv"},
     {lab:"vs LY",key:"ly"}],
    storeRows(idx),
    ["ALL STORES","", rupee(h.seasonT), rupee(h.tToDate), rupee(h.aToDate),
     pct(h.ach), rupee(h.gap), h.need===null?"–":rupee(h.need),
     sspdOf(idx)===null?"–":rupee(sspdOf(idx)), convOf(idx)===null?"–":pct(convOf(idx)),
     spct(h.growth)]));
}

function viewDaily(host){
  host.appendChild(el("h2",null,"Day by day"));
  host.appendChild(el("p","note",
    "Every day of the season for the current selection. Days after "+dlong(D.last)
    +" have a target but no sales yet."));
  var idx=active(), rows=[], ct=0, ca=0;
  for(var d=0;d<DAYS.length;d++){
    var t=sum(TG,idx,d,d), a=d<=LASTI?sum(AC,idx,d,d):null;
    var b=(a===null)?null:ltlBasket(idx,d,d);     // like-to-like for that one day
    ct+=t; if(a!==null) ca+=a;
    rows.push({ cells:[dlabel(DAYS[d]), rupee(t), a===null?"–":rupee(a),
                       a===null?"–":pct(t?a/t:null), rupee(ct), a===null?"–":rupee(ca),
                       b?spct(b.growth):"–"],
                sortv:[DAYS[d], t, a, (a===null||!t)?null:a/t, ct, a===null?null:ca,
                       b?b.growth:null] });
  }
  host.appendChild(table(
    [{lab:"Date",key:"d",cls:"code"},{lab:"Target",key:"t"},{lab:"Actual",key:"a"},{lab:"Ach%",key:"ach"},
     {lab:"Cum. target",key:"ct"},{lab:"Cum. actual",key:"ca"},{lab:"vs LY",key:"ly"}],
    rows, null));
}

function viewGrid(host){
  host.appendChild(el("h2",null,"Store × day grid"));
  host.appendChild(el("p","note","Daily POS actual against target for every store. Scroll sideways for later dates."));
  var idx=active();
  if(!idx.length){ host.appendChild(el("div","empty","No stores match the current filters.")); return; }
  var wrap=el("div","scroll"), tb=el("table"), th=el("thead"), hr=el("tr");
  var a=el("th","stick1","Store"); a.style.textAlign="left"; hr.appendChild(a);
  for(var d=0;d<DAYS.length;d++) hr.appendChild(el("th",null,dlabel(DAYS[d])));
  th.appendChild(hr); tb.appendChild(th);
  var body=el("tbody");
  idx.forEach(function(s){
    var tr=el("tr"); tr.appendChild(el("td","code",S[s].code));
    for(var d=0;d<DAYS.length;d++){
      var t=TG[s][d]||0, v=AC[s][d]||0;
      var td=el("td","num", d>LASTI ? (t?money(t):"–") : (v||t?money(v):"–"));
      if(d<=LASTI && t){
        var r=v/t;
        td.setAttribute("style","background:rgba("+(r>=1?"12,163,12":"208,59,59")+","
          +Math.min(Math.abs(r-1),1).toFixed(2)+")");
        td.title=S[s].code+" · "+dlong(DAYS[d])+"\ntarget "+rupee(t)+"\nactual "+rupee(v)
                +"\nachievement "+pct(r);
      }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  });
  tb.appendChild(body); wrap.appendChild(tb); host.appendChild(wrap);
}

var VIEWS=[{id:"summary",tab:"Summary",fn:viewSummary},
           {id:"stores", tab:"Stores", fn:viewStores},
           {id:"daily",  tab:"Day by day", fn:viewDaily},
           {id:"grid",   tab:"Store × day", fn:viewGrid}];

function renderTabs(){
  var host=document.getElementById("tabs"); host.innerHTML="";
  VIEWS.forEach(function(v){
    var b=el("button",null,v.tab);
    b.type="button"; b.setAttribute("aria-pressed", v.id===state.tab?"true":"false");
    b.addEventListener("click",function(){ state.tab=v.id; render(); });
    host.appendChild(b);
  });
}
function render(){
  renderTabs(); renderTiles();
  var host=document.getElementById("panel"); host.innerHTML="";
  var v=VIEWS.filter(function(x){return x.id===state.tab;})[0]||VIEWS[0];
  v.fn(host);
}

/* ---------- filters ---------- */
(function initFilters(){
  var cl=document.getElementById("fcl"), seen={};
  cl.appendChild(new Option("All clusters",""));
  S.forEach(function(s){ if(s.cluster && !seen[s.cluster]){ seen[s.cluster]=1; cl.appendChild(new Option(s.cluster,s.cluster)); } });
  cl.addEventListener("change",function(e){ state.cl=e.target.value; render(); });
  var dl=document.getElementById("stlist");
  S.forEach(function(s){ dl.appendChild(new Option(s.code)); });
  document.getElementById("fst").addEventListener("change",function(e){
    var v=e.target.value.trim();
    state.st = S.some(function(s){return s.code===v;}) ? v : "";
    if(v && !state.st) e.target.value="";
    render();
  });
  document.getElementById("clear").addEventListener("click",function(){
    state.cl=""; state.st=""; cl.value=""; document.getElementById("fst").value=""; render();
  });
  document.getElementById("pdf").addEventListener("click",function(){ window.print(); });
})();

/* ---------- provenance + staleness ---------- */
/* The pages are Dashboard.html / Diwali.html in the Master folder but
   index.html / diwali.html once published, so the cross-link has to know
   which it is looking at. */
document.getElementById("mainlink").setAttribute("href",
  location.protocol==="file:" ? "Dashboard.html" : "index.html");

document.getElementById("prov").textContent =
  "Built from the DSR folder on "+(D.generated||"")+" · sales through "+dlong(D.last)
 +" · POS only, BILL AMOUNT inclusive of GST · last year is "
 +dlong(lyDate(DAYS[0]))+" to "+dlong(lyDate(DAYS[DAYS.length-1]))
 +", anchored on Diwali — 20 Oct 2025 against 8 Nov 2026 · build "+(D.version||"");

(function staleness(){
  var e=document.getElementById("stale");
  if(!e||!D.generated||!/^\d{4}-\d{2}-\d{2}$/.test(D.generated)) return;
  var p=D.generated.split("-"), built=Date.UTC(+p[0],+p[1]-1,+p[2]);
  var n=new Date(), today=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  var age=Math.round((today-built)/86400000);
  if(!isFinite(age)||age<2) return;
  var days='<span class="age">'+age+' days</span>';
  if(age>=4){ e.className="stale crit";
    e.innerHTML='<b>These season numbers are '+days+' out of date.</b> The morning refresh last '
      +'succeeded on '+dlong(D.generated)+' and has not run since. In a 45-day season that is a '
      +'large share of the window — do not act on this page until it has refreshed.'; }
  else { e.className="stale warn";
    e.innerHTML='<b>Last refreshed '+dlong(D.generated)+'</b>, '+days+' ago. The most recent '
      +'trading days are not in these figures yet.'; }
  e.hidden=false;
})();

render();
})();
</script>
